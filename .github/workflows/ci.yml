name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: List outdated packages
        run: |
          echo "Outdated packages:"
          pip list --outdated --format=columns || true
      - name: Run pip-audit (non-failing)
        run: |
          pip install pip-audit
          pip-audit || true

  tests:
    needs: [dependency-check, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests if present
        run: |
          if [ -d tests ] || ls test_*.py 1> /dev/null 2>&1; then
            pytest -q
          else
            echo "No tests found; skipping test run."
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/*.py') }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run ruff (autofix)
        run: |
          ruff check --fix .
          # Fail the job if ruff modified files; ask contributor to commit fixes
          git diff --exit-code || (echo "ruff made changes; run 'ruff check --fix .' locally and commit them" && exit 1)
      - name: Run mypy (incremental, cached)
        run: |
          mypy --incremental --cache-dir .mypy_cache .
