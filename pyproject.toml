[project]
name = "personal-finance-ai"
version = "0.1.0"
description = "An intelligent personal finance assistant with AI-powered insights"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.3.0",
    "numpy>=1.26.0",
    "plotly>=5.17.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.4.0",
    "prophet>=1.2.1",
    "python-dateutil>=2.8.2",
    "prometheus_client>=0.17.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.3",
    "isort>=5.12",
    "flake8>=6.0",
    "pre-commit>=4.4",
    "mypy>=1.9",
    "ruff>=0.16.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
combine_as_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "data",
    ".venv",
]

